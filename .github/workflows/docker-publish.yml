name: Build and Push Docker Image

# Auto-trigger on version tag push OR release publish
on:
  push:
    tags:
      - "v*.*.*"       # Triggers on: git tag v0.5.0 && git push origin v0.5.0
  release:
    types: [published]  # Also triggers from GitHub UI release creation

env:
  DOCKER_IMAGE: mathumathi247/finops-agent

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pyyaml typer rich boto3 httpx openai anthropic

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-and-push:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        run: |
          # Strip 'v' prefix if present: v0.5.0 -> 0.5.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            # Tag with semantic version: 0.5.0
            type=semver,pattern={{version}}
            # Tag with major.minor: 0.5
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major: 0 (useful for v1+)
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Always tag latest on release
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Verify pushed image
        run: |
          echo "Pushed tags:"
          echo "${{ steps.meta.outputs.tags }}"
          docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
          docker run --rm ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }} --help
